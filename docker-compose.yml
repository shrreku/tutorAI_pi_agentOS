services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studyagent
      POSTGRES_PASSWORD: studyagent
      POSTGRES_DB: studyagent
    ports:
      # Host 5432 is often already taken by a local Postgres; use 5433 for StudyAgent.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyagent -d studyagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/studyagent-local
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studyagent
      MINIO_ROOT_PASSWORD: studyagent-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    image: studyagent-node-dev:latest
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "pnpm install --prefer-offline --network-concurrency 1 --fetch-timeout 600000 --fetch-retries 5 && pnpm --filter @studyagent/schemas run build && pnpm --filter @studyagent/eval-runner run build && pnpm --filter @studyagent/graph run build && pnpm --filter @studyagent/observability run build && pnpm --filter @studyagent/db migrate && pnpm --filter @studyagent/db seed && pnpm --filter @studyagent/api dev",
      ]
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://studyagent:studyagent@postgres:5432/studyagent
      API_PORT: "4000"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: studyagent
      OBJECT_STORAGE_SECRET_KEY: studyagent-local
      OBJECT_STORAGE_BUCKET: studyagent-local
      OBJECT_STORAGE_REGION: us-east-1
      DISABLE_AUTH: ${DISABLE_AUTH:-true}
      SESSION_SECRET: ${SESSION_SECRET:-studyagent-local-session-secret}
      DEV_USER_EMAIL: dev@studyagent.local
      LOG_LEVEL: info
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:4000}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:8080}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      BETA_CONSENT_VERSION: ${BETA_CONSENT_VERSION:-2026-06-25}
      TRIAL_TUTOR_BUDGET_CENTS: ${TRIAL_TUTOR_BUDGET_CENTS:-100}
      MAX_WORKSPACES_PER_LEARNER: ${MAX_WORKSPACES_PER_LEARNER:-5}
      MAX_QUEUED_SOURCES_PER_LEARNER: ${MAX_QUEUED_SOURCES_PER_LEARNER:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      CREDIT_RESERVATION_TTL_SECONDS: ${CREDIT_RESERVATION_TTL_SECONDS:-900}
      INGESTION_TRIGGER_MODE: ${INGESTION_TRIGGER_MODE:-inline}
      INGESTION_TRIGGER_URL: ${INGESTION_TRIGGER_URL:-}
      INGESTION_TRIGGER_TOKEN: ${INGESTION_TRIGGER_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Docker Desktop often cannot reach Cloudflare-hosted APIs directly; forward via host proxy.
      # Use DOCKER_* vars so host-native .env OPENROUTER_BASE_URL does not override container routing.
      OPENROUTER_BASE_URL: ${DOCKER_OPENROUTER_BASE_URL:-http://host.docker.internal:8787/api/v1}
      DEFAULT_TUTOR_MODEL: ${DEFAULT_TUTOR_MODEL:-openrouter/auto}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-120000}
      TUTOR_MAX_TOOL_CALLS: ${TUTOR_MAX_TOOL_CALLS:-16}
      DEFAULT_EXTRACTION_MODEL: ${DEFAULT_EXTRACTION_MODEL:-openrouter/auto}
      EMBEDDING_API_BASE_URL: ${DOCKER_EMBEDDING_API_BASE_URL:-http://host.docker.internal:8787/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      LLAMAPARSE_API_BASE_URL: ${LLAMAPARSE_API_BASE_URL:-https://api.cloud.llamaindex.ai}
      LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-cost_effective}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: studyagent-local
      REDIS_URL: redis://redis:6379
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_FLUSH_AT: ${LANGFUSE_FLUSH_AT:-}
      LANGFUSE_FLUSH_INTERVAL: ${LANGFUSE_FLUSH_INTERVAL:-}
      LANGFUSE_PROMPT_LABEL: ${LANGFUSE_PROMPT_LABEL:-production}
      LANGFUSE_PROMPT_CACHE_TTL_SECONDS: ${LANGFUSE_PROMPT_CACHE_TTL_SECONDS:-300}
      LANGFUSE_PROMPT_FETCH_TIMEOUT_MS: ${LANGFUSE_PROMPT_FETCH_TIMEOUT_MS:-3000}
      LANGFUSE_TUTOR_PROMPT_NAME: ${LANGFUSE_TUTOR_PROMPT_NAME:-studyagent-tutor-system}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_REPLAY_ENABLED: ${POSTHOG_REPLAY_ENABLED:-false}
      POSTHOG_REPLAY_SAMPLE_RATE: ${POSTHOG_REPLAY_SAMPLE_RATE:-1}
      POSTHOG_REPLAY_DISABLED_UNTIL: ${POSTHOG_REPLAY_DISABLED_UNTIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - .:/workspace
      - studyagent-pnpm-store:/root/.local/share/pnpm/store/v3
      - studyagent-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    image: studyagent-node-dev:latest
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "pnpm install --prefer-offline --network-concurrency 1 --fetch-timeout 600000 --fetch-retries 5 && pnpm --filter @studyagent/schemas run build && pnpm --filter @studyagent/eval-runner run build && pnpm --filter @studyagent/observability run build && pnpm --filter @studyagent/worker dev",
      ]
    environment:
      DATABASE_URL: postgres://studyagent:studyagent@postgres:5432/studyagent
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: studyagent
      OBJECT_STORAGE_SECRET_KEY: studyagent-local
      OBJECT_STORAGE_BUCKET: studyagent-local
      OBJECT_STORAGE_REGION: us-east-1
      DISABLE_AUTH: "true"
      DEV_USER_EMAIL: dev@studyagent.local
      LOG_LEVEL: info
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Docker Desktop often cannot reach Cloudflare-hosted APIs directly; forward via host proxy.
      # Use DOCKER_* vars so host-native .env OPENROUTER_BASE_URL does not override container routing.
      OPENROUTER_BASE_URL: ${DOCKER_OPENROUTER_BASE_URL:-http://host.docker.internal:8787/api/v1}
      DEFAULT_TUTOR_MODEL: ${DEFAULT_TUTOR_MODEL:-openrouter/auto}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-120000}
      TUTOR_MAX_TOOL_CALLS: ${TUTOR_MAX_TOOL_CALLS:-16}
      DEFAULT_EXTRACTION_MODEL: ${DEFAULT_EXTRACTION_MODEL:-openrouter/auto}
      EMBEDDING_API_BASE_URL: ${DOCKER_EMBEDDING_API_BASE_URL:-http://host.docker.internal:8787/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      LLAMAPARSE_API_BASE_URL: ${LLAMAPARSE_API_BASE_URL:-https://api.cloud.llamaindex.ai}
      LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-cost_effective}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: studyagent-local
      REDIS_URL: redis://redis:6379
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_FLUSH_AT: ${LANGFUSE_FLUSH_AT:-}
      LANGFUSE_FLUSH_INTERVAL: ${LANGFUSE_FLUSH_INTERVAL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - .:/workspace
      - studyagent-pnpm-store:/root/.local/share/pnpm/store/v3
      - studyagent-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    image: studyagent-node-dev:latest
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "pnpm install --prefer-offline --network-concurrency 1 --fetch-timeout 600000 --fetch-retries 5 && pnpm --filter @studyagent/schemas run build && pnpm --filter @studyagent/eval-runner run build && pnpm --filter @studyagent/observability run build && VITE_API_PROXY_TARGET=http://api:4000 pnpm --filter @studyagent/web dev -- --host 0.0.0.0 --port 5173",
      ]
    ports:
      - "8080:5173"
    environment:
      VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY:-}
      VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-development}
      VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    volumes:
      - .:/workspace
      - studyagent-pnpm-store:/root/.local/share/pnpm/store/v3
      - studyagent-node-modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
  redis-data:
  studyagent-pnpm-store:
  studyagent-node-modules:
