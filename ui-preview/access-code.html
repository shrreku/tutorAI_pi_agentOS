<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access code — TutorBook</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes/folio.css" />
    <link rel="stylesheet" href="themes/focus.css" />
    <link rel="stylesheet" href="themes/sunrise.css" />
    <link rel="stylesheet" href="themes/nocturne.css" />
    <link rel="stylesheet" href="themes/carbon.css" />
  </head>
  <body data-theme="mist">
    <div class="app">
      <div class="center-stage">
        <div class="auth-card">
          <div class="auth-logo">TB</div>
          <h1>Enter your access code</h1>
          <p class="sub">
            TutorBook is in private beta. Enter the 6-character code from your invite email to
            unlock access.
          </p>

          <form onsubmit="return false;">
            <div class="code-inputs">
              <input maxlength="1" inputmode="text" aria-label="Code digit 1" value="T" />
              <input maxlength="1" inputmode="text" aria-label="Code digit 2" value="B" />
              <input maxlength="1" inputmode="text" aria-label="Code digit 3" />
              <input maxlength="1" inputmode="text" aria-label="Code digit 4" />
              <input maxlength="1" inputmode="text" aria-label="Code digit 5" />
              <input maxlength="1" inputmode="text" aria-label="Code digit 6" />
            </div>
            <p class="center-text faint" style="font-size: 12px; margin: 10px 0 20px">
              This is a preview mock — no real code is collected.
            </p>
            <a class="btn primary block lg" href="dashboard.html">Verify code</a>
          </form>

          <div class="auth-foot">
            Already have an account? <a href="login.html">Back to sign in</a>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="themes/folio.js"></script>
    <script src="themes/focus.js"></script>
    <script src="themes/sunrise.js"></script>
    <script src="themes/nocturne.js"></script>
    <script src="themes/carbon.js"></script>
    <script src="partials.js"></script>
  </body>
</html>
