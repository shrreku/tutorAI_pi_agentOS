<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — TutorBook</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="themes/folio.css" />
<link rel="stylesheet" href="themes/focus.css" />
<link rel="stylesheet" href="themes/sunrise.css" />
<link rel="stylesheet" href="themes/nocturne.css" />
<link rel="stylesheet" href="themes/carbon.css" />
</head>
<body data-theme="mist">
<div class="app">
  <div class="center-stage">
    <div class="auth-card">
      <div class="auth-logo">TB</div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue with Organic Chemistry I</p>

      <form onsubmit="return false">
        <div class="form-group">
          <label class="field-label" for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="shreyash@university.edu" autocomplete="email" />
        </div>
        <div class="form-group">
          <div class="between" style="margin-bottom:6px">
            <label class="field-label" for="password" style="margin-bottom:0">Password</label>
            <a href="#" style="color:var(--accent-deep);font-weight:650;font-size:12px">Forgot password?</a>
          </div>
          <input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <a class="btn primary block lg" href="dashboard.html" style="margin-top:6px">Sign in</a>
      </form>

      <div class="divider">or</div>

      <button class="social-btn"><span style="font-size:16px">🔍</span> Continue with Google</button>
      <button class="social-btn"><span style="font-size:16px"></span> Continue with Apple</button>

      <p class="center-text muted" style="font-size:13px;margin:18px 0 0">
        Have a beta invite? <a href="access-code.html" style="color:var(--accent-deep);font-weight:650">Use an access code</a>
      </p>

      <div class="auth-foot">
        New to TutorBook? <a href="onboarding.html">Create account</a>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="themes/folio.js"></script>
<script src="themes/focus.js"></script>
<script src="themes/sunrise.js"></script>
<script src="themes/nocturne.js"></script>
<script src="themes/carbon.js"></script>
<script src="partials.js"></script>
</body>
</html>
