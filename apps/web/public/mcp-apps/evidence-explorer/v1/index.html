<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Evidence Explorer</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading evidence…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { activeId: null } },
          render: function (ctx) {
            var h = ctx.helpers;
            var spans = Array.isArray(ctx.content.spans)
              ? ctx.content.spans
              : Array.isArray(ctx.content.evidence)
                ? ctx.content.evidence
                : [];
            var opened = Array.isArray(ctx.state.canonicalState.openedEvidenceRefIds)
              ? ctx.state.canonicalState.openedEvidenceRefIds
              : [];
            var title = (ctx.state.block && ctx.state.block.title) || "Evidence explorer";

            var html = '<div class="sa-shell">';
            html += h.headerHtml(
              title,
              spans.length +
                " source-backed excerpt" +
                (spans.length === 1 ? "" : "s") +
                " attached to this surface.",
              "Evidence",
            );
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-stack" id="items"></div></div>';
            ctx.root.innerHTML = html;

            var itemsEl = document.getElementById("items");
            if (!spans.length) {
              itemsEl.innerHTML = '<div class="sa-empty">No evidence spans are attached yet.</div>';
              return;
            }

            spans.forEach(function (item, index) {
              var id = item.id || "evidence_" + index;
              var el = document.createElement("div");
              el.className = "sa-list-item";
              if (ctx.state.ui.activeId === id || opened.indexOf(id) >= 0)
                el.classList.add("is-active");
              var pages =
                item.pageStart != null
                  ? "Page " +
                    item.pageStart +
                    (item.pageEnd && item.pageEnd !== item.pageStart ? "–" + item.pageEnd : "")
                  : "";
              el.innerHTML =
                '<div class="sa-list-item-title">' +
                h.escapeHtml(item.label || item.title || "Source excerpt") +
                "</div>" +
                '<div class="sa-list-item-meta">' +
                h.escapeHtml([item.sourceTitle, pages].filter(Boolean).join(" · ")) +
                "</div>" +
                '<div class="sa-list-item-body">' +
                h.escapeHtml(item.excerpt || item.text || "") +
                "</div>";
              el.onclick = function () {
                ctx.state.ui.activeId = id;
                app.submitAction("evidence.source_span_opened", {
                  evidenceRefId: id,
                  spanId: id,
                  index: index,
                });
              };
              itemsEl.appendChild(el);
            });
          },
        });
      })();
    </script>
  </body>
</html>
