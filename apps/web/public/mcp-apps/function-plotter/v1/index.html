<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Function Plotter</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading simulation…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        function evalExpr(expr, x, a) {
          try {
            var fn = new Function("x", "a", "return " + expr);
            var y = fn(x, a);
            return Number.isFinite(y) ? y : null;
          } catch (_error) {
            return null;
          }
        }

        var app = StudyAgentShell.createBridge({
          state: {
            ui: {
              a: 1,
              expression: "a * x * x",
              xMin: -5,
              xMax: 5,
              note: "",
            },
          },
          render: function (ctx) {
            var h = ctx.helpers;
            var params = ctx.content.parameters || {};
            if (typeof params.expression === "string")
              ctx.state.ui.expression = params.expression.replace(/\^/g, "**");
            if (typeof params.a === "number") ctx.state.ui.a = params.a;
            if (typeof params.xMin === "number") ctx.state.ui.xMin = params.xMin;
            if (typeof params.xMax === "number") ctx.state.ui.xMax = params.xMax;
            var prompt = ctx.content.prompt || "Adjust the parameter and describe what changes.";

            var html = '<div class="sa-shell">';
            html += h.headerHtml("Function plotter", prompt, "Simulation");
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-card sa-stack">';
            html +=
              '<div class="sa-canvas-wrap"><canvas id="plot" width="640" height="260"></canvas></div>';
            html +=
              '<label class="sa-field-label" for="param">Parameter a = <span id="param-value"></span></label>';
            html +=
              '<input class="sa-input" id="param" type="range" min="-3" max="3" step="0.1" />';
            html += '<label class="sa-field-label" for="note">What do you observe?</label>';
            html +=
              '<textarea class="sa-textarea" id="note" placeholder="Describe how the curve changes when you move the slider…"></textarea>';
            html +=
              '<div class="sa-row"><button class="sa-btn sa-btn-primary" id="submit">Submit observation</button></div>';
            html += "</div></div>";
            ctx.root.innerHTML = html;

            var slider = document.getElementById("param");
            var noteEl = document.getElementById("note");
            slider.value = String(ctx.state.ui.a);
            document.getElementById("param-value").textContent = String(ctx.state.ui.a);
            noteEl.value = ctx.state.ui.note || "";

            function draw() {
              var canvas = document.getElementById("plot");
              var g = canvas.getContext("2d");
              var width = canvas.width;
              var height = canvas.height;
              g.clearRect(0, 0, width, height);
              g.fillStyle = "#f9fafb";
              g.fillRect(0, 0, width, height);
              g.strokeStyle = "#e5e7eb";
              g.beginPath();
              g.moveTo(0, height / 2);
              g.lineTo(width, height / 2);
              g.moveTo(width / 2, 0);
              g.lineTo(width / 2, height);
              g.stroke();
              g.strokeStyle = "#2563eb";
              g.lineWidth = 2;
              g.beginPath();
              var started = false;
              for (var px = 0; px <= width; px += 1) {
                var t = ctx.state.ui.xMin + (px / width) * (ctx.state.ui.xMax - ctx.state.ui.xMin);
                var yVal = evalExpr(ctx.state.ui.expression, t, ctx.state.ui.a);
                if (yVal == null) continue;
                var py = height / 2 - yVal * 8;
                if (!started) {
                  g.moveTo(px, py);
                  started = true;
                } else {
                  g.lineTo(px, py);
                }
              }
              g.stroke();
            }

            slider.oninput = function () {
              ctx.state.ui.a = Number(slider.value);
              document.getElementById("param-value").textContent = String(ctx.state.ui.a);
              draw();
              app.submitAction("simulation.parameter_snapshot_submitted", {
                parameterSnapshot: { a: ctx.state.ui.a, expression: ctx.state.ui.expression },
              });
            };
            noteEl.oninput = function () {
              ctx.state.ui.note = noteEl.value;
            };
            document.getElementById("submit").onclick = function () {
              app.submitAction("simulation.observation_submitted", {
                observation: ctx.state.ui.note || "Learner submitted an observation.",
                parameterSnapshot: { a: ctx.state.ui.a, expression: ctx.state.ui.expression },
              });
            };
            draw();
          },
        });
      })();
    </script>
  </body>
</html>
