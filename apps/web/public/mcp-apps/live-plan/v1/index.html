<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Live Plan</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading live plan…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { selectedActionId: null } },
          render: function (ctx) {
            var h = ctx.helpers;
            var content = ctx.content;
            var current = content.currentObjective || null;
            var upcoming = Array.isArray(content.upcomingObjectives)
              ? content.upcomingObjectives
              : [];
            var weak = Array.isArray(content.weakConcepts) ? content.weakConcepts : [];
            var actions = Array.isArray(content.nextActions)
              ? content.nextActions
              : [
                  { id: "continue_objective", label: "Continue current objective" },
                  { id: "review_weak_concepts", label: "Review weak concepts" },
                  { id: "slow_down", label: "Slow down pace" },
                  { id: "go_deeper", label: "Go deeper on this topic" },
                ];

            var html = '<div class="sa-shell">';
            html += h.headerHtml(
              "Live plan",
              "Choose what to do next in this study session.",
              "Plan",
            );
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-card sa-stack">';
            if (current) {
              html +=
                '<div><div class="sa-field-label">Current objective</div><div style="font-size:16px;font-weight:700;">' +
                h.escapeHtml(current.title || current.id) +
                "</div></div>";
            }
            if (upcoming.length) {
              html += '<div><div class="sa-field-label">Up next</div><div class="sa-stack">';
              upcoming.slice(0, 4).forEach(function (item) {
                html += '<div class="sa-pill">' + h.escapeHtml(item.title || item.id) + "</div>";
              });
              html += "</div></div>";
            }
            if (weak.length) {
              html += '<div><div class="sa-field-label">Needs attention</div><div class="sa-row">';
              weak.slice(0, 6).forEach(function (item) {
                html +=
                  '<span class="sa-pill sa-pill-warning">' +
                  h.escapeHtml(item.name || item.id) +
                  "</span>";
              });
              html += "</div></div>";
            }
            html += "</div>";
            html += '<div class="sa-stack" id="actions"></div></div>';
            ctx.root.innerHTML = html;

            var actionsEl = document.getElementById("actions");
            actions.forEach(function (action) {
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "sa-btn sa-choice";
              if (ctx.state.ui.selectedActionId === action.id) btn.classList.add("is-selected");
              btn.innerHTML =
                '<span class="sa-choice-badge">→</span><span>' +
                h.escapeHtml(action.label || action.title || action.id) +
                "</span>";
              btn.onclick = function () {
                ctx.state.ui.selectedActionId = action.id;
                if (action.id === "continue_objective" && current && current.id) {
                  h.navigate(current.id);
                  return;
                }
                if (action.id === "review_weak_concepts" && weak.length) {
                  var target = weak[0];
                  if (target && target.id) {
                    h.navigate(target.id);
                    return;
                  }
                }
                app.submitAction("live_plan.action_selected", { actionId: action.id });
              };
              actionsEl.appendChild(btn);
            });
          },
        });
      })();
    </script>
  </body>
</html>
