<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Comparison</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading comparison…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { activeRow: null } },
          render: function (ctx) {
            var h = ctx.helpers;
            var rows = Array.isArray(ctx.content.comparisonRows) ? ctx.content.comparisonRows : [];
            var leftTitle = ctx.content.leftTitle || "Left";
            var rightTitle = ctx.content.rightTitle || "Right";
            var checkpoint = ctx.content.checkpointQuestion || "";

            if (!rows.length) {
              ctx.root.innerHTML =
                h.headerHtml(
                  "Comparison",
                  "Review similarities and differences side by side.",
                  "Compare",
                ) + '<div class="sa-empty">No comparison rows are available yet.</div>';
              return;
            }

            var html = '<div class="sa-shell">';
            html += h.headerHtml(
              "Comparison",
              "Tap a row to inspect its supporting evidence.",
              "Compare",
            );
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html +=
              '<div class="sa-table-wrap"><table class="sa-table"><thead><tr><th>Dimension</th><th>' +
              h.escapeHtml(leftTitle) +
              "</th><th>" +
              h.escapeHtml(rightTitle) +
              '</th></tr></thead><tbody id="rows"></tbody></table></div>';
            if (checkpoint) {
              html +=
                '<div class="sa-card sa-stack"><div class="sa-field-label">Checkpoint</div><div>' +
                h.escapeHtml(checkpoint) +
                "</div>";
              html +=
                '<button class="sa-btn sa-btn-primary" id="complete">Mark reviewed</button></div>';
            }
            html += "</div>";
            ctx.root.innerHTML = html;

            var rowsEl = document.getElementById("rows");
            rows.forEach(function (row, index) {
              var tr = document.createElement("tr");
              if (ctx.state.ui.activeRow === index) tr.style.background = "#eff6ff";
              tr.innerHTML =
                "<td><strong>" +
                h.escapeHtml(row.dimension || row.attribute || "Row " + (index + 1)) +
                "</strong></td><td>" +
                h.escapeHtml(row.left || "") +
                "</td><td>" +
                h.escapeHtml(row.right || "") +
                "</td>";
              tr.onclick = function () {
                ctx.state.ui.activeRow = index;
                app.submitAction("evidence.source_span_opened", {
                  spanId: row.dimension || String(index),
                  index: index,
                });
              };
              rowsEl.appendChild(tr);
            });

            var completeBtn = document.getElementById("complete");
            if (completeBtn) {
              completeBtn.onclick = function () {
                app.submitAction("surface.completed", {});
              };
            }
          },
        });
      })();
    </script>
  </body>
</html>
