<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Quiz</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading quiz…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { index: 0, selectedIndex: null, selectedValue: "", openAnswer: "" } },
          render: function (ctx) {
            var h = ctx.helpers;
            var content = ctx.content;
            var questions = Array.isArray(content.questions) ? content.questions : [];
            var completed = Array.isArray(ctx.state.canonicalState.completedQuestionIds)
              ? ctx.state.canonicalState.completedQuestionIds
              : [];
            var index = Math.min(
              Math.max(ctx.state.ui.index || 0, 0),
              Math.max(questions.length - 1, 0),
            );
            ctx.state.ui.index = index;
            var question = questions[index] || null;
            var title = (ctx.state.block && ctx.state.block.title) || "Practice quiz";

            if (!question) {
              ctx.root.innerHTML =
                h.headerHtml(title, "Answer each question to check your understanding.", "Quiz") +
                '<div class="sa-empty">No questions in this quiz yet.</div>';
              return;
            }

            var choices = question.choices || question.options || [];
            var hasChoices = choices.length > 0;
            var qid = question.id || "q_" + index;
            var isDone = completed.indexOf(qid) >= 0;
            var progress = questions.length
              ? Math.round(((index + (isDone ? 1 : 0)) / questions.length) * 100)
              : 0;

            var html = '<div class="sa-shell">';
            html += h.headerHtml(
              title,
              "Question " + (index + 1) + " of " + questions.length,
              "Quiz",
            );
            html += '<div class="sa-progress"><span style="width:' + progress + '%"></span></div>';
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-card sa-stack">';
            html +=
              '<div style="font-size:16px;font-weight:700;line-height:1.45;">' +
              h.escapeHtml(question.prompt || question.title || "Question") +
              "</div>";
            if (hasChoices) {
              html += '<div class="sa-stack" id="choices"></div>';
            } else {
              html += '<label class="sa-field-label" for="open-answer">Your answer</label>';
              html +=
                '<textarea class="sa-textarea" id="open-answer" placeholder="Write your answer in your own words…"></textarea>';
            }
            if (question.explanation && isDone) {
              html +=
                '<div class="sa-status sa-status-info">' +
                h.escapeHtml(question.explanation) +
                "</div>";
            }
            html +=
              '<div class="sa-row"><button class="sa-btn" id="prev"' +
              (index === 0 ? " disabled" : "") +
              ">Previous</button>";
            html +=
              '<button class="sa-btn sa-btn-primary" id="submit"' +
              (isDone ? " disabled" : "") +
              ">Check answer</button>";
            html +=
              '<button class="sa-btn" id="next"' +
              (index >= questions.length - 1 ? " disabled" : "") +
              ">Next</button></div>";
            var evidenceRefs =
              (ctx.state.block &&
                Array.isArray(ctx.state.block.evidenceRefs) &&
                ctx.state.block.evidenceRefs) ||
              [];
            if (evidenceRefs.length) {
              html +=
                '<div><div class="sa-field-label">Source evidence</div><div class="sa-row" id="evidence"></div></div>';
            }
            html +=
              '<div class="sa-row"><button class="sa-btn" id="help" type="button">Ask tutor for help</button></div>';
            html += "</div></div>";
            ctx.root.innerHTML = html;

            var choicesEl = document.getElementById("choices");
            if (choicesEl) {
              choices.forEach(function (choice, choiceIndex) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "sa-btn sa-choice";
                if (ctx.state.ui.selectedIndex === choiceIndex) btn.classList.add("is-selected");
                btn.innerHTML =
                  '<span class="sa-choice-badge">' +
                  String.fromCharCode(65 + choiceIndex) +
                  "</span><span>" +
                  h.escapeHtml(choice) +
                  "</span>";
                btn.onclick = function () {
                  ctx.state.ui.selectedIndex = choiceIndex;
                  ctx.state.ui.selectedValue = choice;
                  Array.from(choicesEl.children).forEach(function (node) {
                    node.classList.remove("is-selected");
                  });
                  btn.classList.add("is-selected");
                };
                choicesEl.appendChild(btn);
              });
            } else {
              var answerEl = document.getElementById("open-answer");
              answerEl.value = ctx.state.ui.openAnswer || "";
              answerEl.oninput = function () {
                ctx.state.ui.openAnswer = answerEl.value;
              };
            }

            function answerCorrect(selected, selectedIndex) {
              var ref =
                question.referenceAnswer != null ? question.referenceAnswer : question.answer;
              if (ref == null || ref === "") return true;
              if (String(ref) === String(selectedIndex)) return true;
              if (String(ref) === String(selected)) return true;
              var refChoice = choices[Number(ref)];
              if (refChoice != null && String(refChoice) === String(selected)) return true;
              return String(selected).trim().toLowerCase() === String(ref).trim().toLowerCase();
            }

            document.getElementById("submit").onclick = function () {
              var answer = hasChoices ? ctx.state.ui.selectedValue : ctx.state.ui.openAnswer;
              if (hasChoices && ctx.state.ui.selectedIndex == null) return;
              if (!String(answer || "").trim()) return;
              var correct = answerCorrect(answer, ctx.state.ui.selectedIndex);
              app.submitAction("quiz.answer_submitted", {
                questionId: qid,
                answer: answer,
                isCorrect: correct,
              });
              if (choicesEl) {
                Array.from(choicesEl.children).forEach(function (node, nodeIndex) {
                  node.classList.toggle(
                    "is-correct",
                    nodeIndex === ctx.state.ui.selectedIndex && correct,
                  );
                  node.classList.toggle(
                    "is-incorrect",
                    nodeIndex === ctx.state.ui.selectedIndex && !correct,
                  );
                });
              }
            };
            document.getElementById("prev").onclick = function () {
              if (index > 0) {
                ctx.state.ui.index = index - 1;
                ctx.state.ui.selectedIndex = null;
                ctx.state.ui.selectedValue = "";
                ctx.state.ui.openAnswer = "";
                app.mount();
              }
            };
            document.getElementById("next").onclick = function () {
              if (index < questions.length - 1) {
                ctx.state.ui.index = index + 1;
                ctx.state.ui.selectedIndex = null;
                ctx.state.ui.selectedValue = "";
                ctx.state.ui.openAnswer = "";
                app.mount();
              }
            };
            var evidenceEl = document.getElementById("evidence");
            if (evidenceEl) {
              evidenceRefs.forEach(function (ref, refIndex) {
                var id = ref.refId || ref.id || "evidence_" + refIndex;
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "sa-btn sa-pill";
                btn.textContent = ref.label || ref.title || "Source " + (refIndex + 1);
                btn.onclick = function () {
                  app.submitAction("evidence.source_span_opened", {
                    evidenceRefId: id,
                    spanId: id,
                    index: refIndex,
                  });
                };
                evidenceEl.appendChild(btn);
              });
            }
            document.getElementById("help").onclick = function () {
              app.submitAction("tutor.help_requested", {
                message:
                  "I need help with quiz question " +
                  (index + 1) +
                  (question.prompt ? ": " + question.prompt : ""),
              });
            };
          },
        });
      })();
    </script>
  </body>
</html>
