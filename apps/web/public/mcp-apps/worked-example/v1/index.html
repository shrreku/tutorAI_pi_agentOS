<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Worked Example</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading worked example…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { stepIndex: 0, answer: "", revealed: false } },
          render: function (ctx) {
            var h = ctx.helpers;
            var steps = Array.isArray(ctx.content.steps) ? ctx.content.steps : [];
            var index = Math.min(
              Math.max(ctx.state.ui.stepIndex || 0, 0),
              Math.max(steps.length - 1, 0),
            );
            ctx.state.ui.stepIndex = index;
            var step = steps[index] || null;
            var title = (ctx.state.block && ctx.state.block.title) || "Worked example";
            var problem = ctx.content.problemStatement || ctx.content.problem || "";

            if (!step) {
              ctx.root.innerHTML =
                h.headerHtml(title, problem, "Worked example") +
                '<div class="sa-empty">No guided steps are available yet.</div>';
              return;
            }

            var stepTitle = step.title || step.prompt || "Step " + (index + 1);
            var stepBody = step.body || step.description || "";
            var html = '<div class="sa-shell">';
            html += h.headerHtml(title, "Step " + (index + 1) + " of " + steps.length, "Worked example");
            if (problem) html += '<div class="sa-card sa-card-muted">' + h.escapeHtml(problem) + "</div>";
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-card sa-stack">';
            html += '<div style="font-size:16px;font-weight:700;">' + h.escapeHtml(stepTitle) + "</div>";
            if (stepBody) html += '<div class="sa-list-item-body">' + h.escapeHtml(stepBody) + "</div>";
            if (ctx.state.ui.revealed && (step.solution || step.answer)) {
              html +=
                '<div class="sa-status sa-status-info"><strong>Solution</strong><div style="margin-top:6px;">' +
                h.escapeHtml(step.solution || step.answer) +
                "</div></div>";
            }
            html += '<label class="sa-field-label" for="answer">Your attempt</label>';
            html += '<textarea class="sa-textarea" id="answer" placeholder="Write your reasoning for this step…"></textarea>';
            html += '<div class="sa-row">';
            html += '<button class="sa-btn sa-btn-primary" id="submit">Submit step</button>';
            html += '<button class="sa-btn" id="reveal">Reveal solution</button>';
            html += '<button class="sa-btn" id="prev"' + (index === 0 ? " disabled" : "") + ">Previous</button>";
            html += '<button class="sa-btn" id="next"' + (index >= steps.length - 1 ? " disabled" : "") + ">Next</button>";
            html += "</div></div></div>";
            ctx.root.innerHTML = html;

            var answerEl = document.getElementById("answer");
            answerEl.value = ctx.state.ui.answer || "";
            answerEl.oninput = function () {
              ctx.state.ui.answer = answerEl.value;
            };

            document.getElementById("submit").onclick = function () {
              app.submitAction("worked_example.step_answered", {
                stepId: step.id || stepTitle,
                answer: answerEl.value,
              });
              if (index < steps.length - 1) {
                ctx.state.ui.stepIndex = index + 1;
                ctx.state.ui.answer = "";
                ctx.state.ui.revealed = false;
              }
            };
            document.getElementById("reveal").onclick = function () {
              ctx.state.ui.revealed = true;
              app.submitAction("worked_example.step_revealed", { stepId: step.id || stepTitle });
            };
            document.getElementById("prev").onclick = function () {
              if (index > 0) {
                ctx.state.ui.stepIndex = index - 1;
                ctx.state.ui.answer = "";
                ctx.state.ui.revealed = false;
                app.mount();
              }
            };
            document.getElementById("next").onclick = function () {
              if (index < steps.length - 1) {
                ctx.state.ui.stepIndex = index + 1;
                ctx.state.ui.answer = "";
                ctx.state.ui.revealed = false;
                app.mount();
              }
            };
          },
        });
      })();
    </script>
  </body>
</html>
