<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAgent Source Reader</title>
    <link rel="stylesheet" href="/mcp-apps/shared/v1/shell.css" />
  </head>
  <body>
    <div id="sa-root" class="sa-shell">Loading source reader…</div>
    <script src="/mcp-apps/shared/v1/shell.js"></script>
    <script>
      (function () {
        var app = StudyAgentShell.createBridge({
          state: { ui: { selectedSpanId: null, note: "" } },
          render: function (ctx) {
            var h = ctx.helpers;
            var spans = Array.isArray(ctx.content.evidence)
              ? ctx.content.evidence
              : Array.isArray(ctx.content.spans)
                ? ctx.content.spans
                : [];
            if (ctx.state.canonicalState && ctx.state.canonicalState.selectedSpanId) {
              ctx.state.ui.selectedSpanId = ctx.state.canonicalState.selectedSpanId;
            }
            var title = (ctx.state.block && ctx.state.block.title) || "Source reader";

            var html = '<div class="sa-shell">';
            html += h.headerHtml(
              title,
              "Select a passage, then note what is confusing or ask the tutor to explain it.",
              "Source",
            );
            html += h.pendingOverlay(ctx.state);
            html += h.statusHtml(ctx.state);
            html += '<div class="sa-stack" id="items"></div>';
            html += '<div class="sa-card sa-stack">';
            html += '<label class="sa-field-label" for="note">Your note</label>';
            html += '<textarea class="sa-textarea" id="note" placeholder="What is unclear about the selected passage?"></textarea>';
            html += '<div class="sa-row"><button class="sa-btn sa-btn-primary" id="save">Save note</button>';
            html += '<button class="sa-btn" id="help" type="button">Ask tutor to explain</button></div>';
            html += "</div></div>";
            ctx.root.innerHTML = html;

            var itemsEl = document.getElementById("items");
            if (!spans.length) {
              itemsEl.innerHTML = '<div class="sa-empty">No source excerpts are available yet.</div>';
            } else {
              spans.forEach(function (item, index) {
                var id = item.id || "span_" + index;
                var el = document.createElement("div");
                el.className = "sa-list-item";
                if (ctx.state.ui.selectedSpanId === id) el.classList.add("is-active");
                el.innerHTML =
                  '<div class="sa-list-item-title">' +
                  h.escapeHtml(item.label || item.sourceTitle || "Excerpt " + (index + 1)) +
                  "</div>" +
                  '<div class="sa-list-item-body">' +
                  h.escapeHtml(item.excerpt || item.text || "") +
                  "</div>";
                el.onclick = function () {
                  ctx.state.ui.selectedSpanId = id;
                  app.submitAction("evidence.source_span_opened", {
                    spanId: id,
                    evidenceRefId: id,
                  });
                };
                itemsEl.appendChild(el);
              });
            }

            var noteEl = document.getElementById("note");
            noteEl.value = ctx.state.ui.note || "";
            noteEl.oninput = function () {
              ctx.state.ui.note = noteEl.value;
            };
            document.getElementById("save").onclick = function () {
              if (!ctx.state.ui.selectedSpanId || !noteEl.value.trim()) {
                app.setStatus("Select a passage and write a note first.", "error");
                return;
              }
              app.submitAction("source_reader.annotation_created", {
                spanId: ctx.state.ui.selectedSpanId,
                annotation: noteEl.value.trim(),
                confusing: true,
              });
              ctx.state.ui.note = "";
            };
            document.getElementById("help").onclick = function () {
              var selected = spans.find(function (item, idx) {
                var id = item.id || "span_" + idx;
                return id === ctx.state.ui.selectedSpanId;
              });
              app.submitAction("tutor.help_requested", {
                message: selected
                  ? "Please explain this source excerpt: " + (selected.excerpt || selected.text || "")
                  : "Please help me understand this source material.",
              });
            };
          },
        });
      })();
    </script>
  </body>
</html>
